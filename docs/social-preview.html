<!--
  Source of docs/social-preview.png (README image and GitHub social preview, Settings > General).
  Serve the repo root (python3 -m http.server 8765), open /docs/social-preview.html,
  capture at 1280x640, 2x.
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/dist/tokens.css">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--mbar-gradient-deep, #0b1f3a); font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff; }
  .wrap { position: relative; width: 1280px; height: 640px; box-sizing: border-box; padding: 64px; }
  .logo { height: 72px; display: block; }
  p { margin: 22px 0 0; font-size: 28px; color: rgb(255 255 255 / 0.72); }
  .scale { display: flex; gap: 10px; margin-top: 52px; }
  .scale div { flex: 1; height: 92px; border-radius: 10px; display: flex; align-items: flex-end; padding: 10px 12px; box-sizing: border-box; font: 15px ui-monospace, Menlo, monospace; }
  .label { margin-top: 26px; font-size: 18px; color: rgb(255 255 255 / 0.6); letter-spacing: 0.08em; text-transform: uppercase; }
  .label:first-of-type { margin-top: 44px; }
  .scale.navy { margin-top: 10px; } .scale.ocean { margin-top: 10px; }
  .foot { position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; justify-content: space-between; font-size: 20px; color: rgb(255 255 255 / 0.6); }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="/logos/millibar-lockup-white.svg" alt="">
  <p>Brand tokens and logos for every Millibar project.</p>
  <div class="label">Navy · brand surfaces</div>
  <div class="scale navy" id="navy"></div>
  <div class="label">Ocean · actions</div>
  <div class="scale ocean" id="ocean"></div>
  <div class="foot">
    <div>CSS variables · Tailwind v3 and v4 · shadcn</div>
    <div>github.com/MBAR-Millibar/millibar-tokens</div>
  </div>
</div>
<script>
  const css = getComputedStyle(document.documentElement);
  const fill = (id, scale, steps) => {
    for (const step of steps) {
      const d = document.createElement('div');
      d.style.background = `var(--mbar-${scale}-${step})`;
      d.style.boxShadow = 'inset 0 0 0 1px rgb(255 255 255 / 0.12)';
      d.style.color = step >= 500 || scale === 'navy' ? 'rgb(255 255 255 / 0.85)' : '#0b1f3a';
      d.textContent = step;
      document.getElementById(id).append(d);
    }
  };
  fill('navy', 'navy', [600, 700, 800, 900, 950]);
  fill('ocean', 'ocean', [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950]);
</script>
</body>
</html>
