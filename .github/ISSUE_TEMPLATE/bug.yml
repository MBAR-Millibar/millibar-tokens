name: 🐛 Bug
description: A token, generated file or logo is wrong or doesn't load.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: And what you expected instead. A screenshot helps for colours and logos.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The tag you install, for example v1.1.0.
    validations:
      required: true
  - type: dropdown
    id: file
    attributes:
      label: File
      multiple: true
      options:
        - tokens.css
        - tailwind.css (Tailwind v4)
        - tailwind-preset (Tailwind v3)
        - shadcn.css / shadcn-hsl.css
        - tokens.json
        - logos/
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project
      placeholder: app.millibar.io, Next.js 15 + Tailwind v4
