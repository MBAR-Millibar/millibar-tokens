name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dist is up to date
        run: npm run build && git diff --exit-code dist
      - name: Logos are valid SVG
        run: |
          for f in logos/*.svg; do
            grep -q '<svg' "$f" && grep -q '</svg>' "$f" || { echo "::error file=$f::not an SVG"; exit 1; }
          done
